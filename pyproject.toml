[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "space-geovision"
version = "1.8.3"
description = "GUI for optical, SAR (via ESA SNAP) and vector geospatial analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ismail Elkhrachy" }]
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "scikit-learn>=1.2",
  "scikit-image>=0.21", "opencv-python>=4.8", "rasterio>=1.3", "geopandas>=0.14", "shapely>=2.0",
  "pyproj>=3.5", "PyQt5>=5.15", "psutil>=5.9", "Pillow>=9.5", "joblib>=1.2",
  "ezdxf>=1.0", "matplotlib-scalebar>=0.8",
]

[project.optional-dependencies]
sam = ["torch>=2.0", "segment-anything>=1.0"]
extras = ["whitebox>=2.3", "folium>=0.14", "leafmap>=0.25", "contextily>=1.3", "cartopy>=0.22", "PyQtWebEngine>=5.15"]
test = ["pytest>=7"]

[project.gui-scripts]
space-geovision = "main:main"

[tool.setuptools]
py-modules = ["cli", "main", "ui", "helpers", "polygon_processor", "sar_snap", "supervised", "accuracy", "validation", "change_detection", "water_mapping", "flood", "resources", "terrain", "imageops", "raster_expr", "georef", "basins", "webmap", "mapexport", "mapexport_ui", "labeler", "labeler_ui", "bandstack", "ee_label"]
